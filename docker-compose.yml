name: jobs-scraper

# Infraestrutura: `docker compose up -d`
# Infraestrutura + serviços da aplicação: `docker compose --profile app up -d --build`
# Com GPU NVIDIA: adicione `-f docker-compose.yml -f docker-compose.gpu.yml`

x-app-env: &app-env
  RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
  MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/jobs?authSource=admin
  OLLAMA_HOST: http://ollama:11434
  LOG_PRETTY: 'false'

# Os serviços atualizam um heartbeat enquanto estão conectados ao RabbitMQ (e ao MongoDB, se usam);
# heartbeat velho = desconectado ou travado (aparece como "unhealthy" no `docker compose ps`)
x-app-healthcheck: &app-healthcheck
  test: ['CMD', 'bun', 'src/shared/health/healthcheck.ts']
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

services:
  rabbitmq:
    image: rabbitmq:4.2-management
    ports:
      - '127.0.0.1:15672:15672' # Management UI
      - '127.0.0.1:5672:5672' # AMQP
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?defina RABBITMQ_USER no .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD no .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 10

  ollama:
    image: ollama/ollama:0.40.0
    ports:
      - '127.0.0.1:11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 10s
      retries: 10

  # Baixa o modelo usado pelo post-processing (roda uma vez e termina)
  ollama-init:
    image: ollama/ollama:0.40.0
    entrypoint: ['ollama', 'pull', '${OLLAMA_MODEL:-gemma3:4b}']
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: 'no'

  mongo:
    image: mongo:8.2
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?defina MONGO_USER no .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?defina MONGO_PASSWORD no .env}
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 10

  mongo_express:
    image: mongo-express:1.0.2
    ports:
      - '127.0.0.1:8081:8081'
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/
      ME_CONFIG_BASICAUTH: 'true'
      ME_CONFIG_BASICAUTH_ENABLED: 'true'
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:?defina MONGO_EXPRESS_USER no .env}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:?defina MONGO_EXPRESS_PASSWORD no .env}
    depends_on:
      mongo:
        condition: service_healthy

  # ---- Serviços da aplicação (profile "app") ----

  scraper:
    profiles: [app]
    build:
      context: .
      target: scraper
    env_file: .env
    environment:
      <<: *app-env
      HEADLESS: 'true'
      BROWSER_NO_SANDBOX: 'true'
    volumes:
      - scraper_data:/app/data/scraper
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck: *app-healthcheck
    # Com SCRAPER_INTERVAL_MINUTES > 0 o scraper fica rodando: coleta periodicamente e atende o "coletar agora";
    # com 0 ele roda uma vez e termina (agende com cron/`docker compose run`)
    # Sem restart automático: reiniciar em loop após falha de login aumentaria o risco de bloqueio da conta
    restart: 'no'

  post-processing:
    profiles: [app]
    build:
      context: .
      target: app
    command: ['bun', 'src/services/post-processing/index.ts']
    env_file: .env
    environment: *app-env
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    healthcheck: *app-healthcheck
    restart: unless-stopped

  storage:
    profiles: [app]
    build:
      context: .
      target: app
    command: ['bun', 'src/services/storage/index.ts']
    env_file: .env
    environment: *app-env
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck: *app-healthcheck
    restart: unless-stopped

  discord-bot:
    profiles: [app]
    build:
      context: .
      target: app
    command: ['bun', 'src/services/discord-bot/index.ts']
    env_file: .env
    environment: *app-env
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck: *app-healthcheck
    restart: unless-stopped

  cv-updater:
    profiles: [app]
    build:
      context: .
      target: cv-updater
    env_file: .env
    environment:
      <<: *app-env
      TECTONIC_BIN: tectonic
    volumes:
      - ./data/cv/cv.tex:/app/data/cv/cv.tex:ro
      - ./data/cv/generated:/app/data/cv/generated
      # Cache dos repositórios do GitHub
      - cv_cache:/app/data/cache
      # Cache dos pacotes LaTeX baixados pelo Tectonic na primeira compilação
      - tectonic_cache:/home/bun/.cache/Tectonic
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    healthcheck: *app-healthcheck
    restart: unless-stopped

volumes:
  ollama_data:
  rabbitmq_data:
  mongo_data:
  scraper_data:
  tectonic_cache:
  cv_cache:
