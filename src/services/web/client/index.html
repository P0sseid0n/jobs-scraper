<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<title>jobs/scraper</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
		/>
		<script>
			// Aplica o tema antes de pintar a página (evita o flash do tema claro)
			try {
				const saved = JSON.parse(localStorage.getItem('theme') ?? '"system"')
				const dark = saved === 'dark' || (saved === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
				document.documentElement.dataset.theme = dark ? 'dark' : 'light'
			} catch {}
		</script>
	</head>
	<body class="text-base">
		<div id="app"></div>
		<script type="module" src="./main.tsx"></script>
	</body>
</html>
